<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">

<script>

document.documentElement.setAttribute('data-theme',t)})();

<style>
:root{
  --bg:#0e1116; --bg2:#141a22; --bg3:#1a222c; --line:#26303c;
  --fg:#e6edf3; --fg2:#9fb0c0; --fg3:#6b7d8f; --accent:#4ea1ff;
  --toolbar:rgba(14,17,22,.93); --chip-on-fg:#0e1116;
  --rowline:rgba(38,48,60,.55); --rowhover:rgba(78,161,255,.05);
  --mark-bg:rgba(240,160,75,.28); --mark-fg:#ffd9a8;
  --head-glow:rgba(78,161,255,.06); --btn-shadow:rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --bg:#f7f9fb; --bg2:#ffffff; --bg3:#eef2f7; --line:#d4dce5;
  --fg:#16202b; --fg2:#46586a; --fg3:#5d6e80; --accent:#1c5fb0;
  --toolbar:rgba(247,249,251,.94); --chip-on-fg:#ffffff;
  --rowline:rgba(212,220,229,.95); --rowhover:rgba(28,95,176,.05);
  --mark-bg:#f6e2c0; --mark-fg:#6b4a10;
  --head-glow:rgba(28,95,176,.05); --btn-shadow:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px 80px}
.back{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 -16px}
.theme-btn{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--bg2);color:var(--fg);font-size:12px;line-height:1;cursor:pointer;
  box-shadow:0 2px 10px var(--btn-shadow);transition:color .15s,border-color .15s}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}
.back a{display:inline-block;font-size:13px;color:var(--fg2);text-decoration:none;border:1px solid var(--line);background:var(--bg2);border-radius:20px;padding:4px 13px;transition:color .15s,border-color .15s}
.back a:hover{color:var(--accent);border-color:var(--accent)}

header{padding:38px 0 24px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--head-glow),transparent)}
h1{font-size:25px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1 .badge{font-size:12px;font-weight:500;padding:3px 10px;border-radius:20px;
  background:rgba(78,161,255,.15);color:var(--accent);border:1px solid rgba(78,161,255,.3)}
.sub{color:var(--fg2);margin-top:10px;font-size:13px}
.sub b{color:var(--fg)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin:26px 0 6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:14px 16px;
  position:relative;overflow:hidden;transition:.2s;cursor:pointer}
.stat:hover{transform:translateY(-2px);border-color:var(--fg3)}
.stat::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.stat .n{font-size:22px;font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.stat .t{font-size:12.5px;color:var(--fg2);margin-top:2px;display:flex;align-items:center;gap:6px}
.stat .s{font-size:11px;color:var(--fg3)}

.toolbar{position:sticky;top:0;z-index:50;background:var(--toolbar);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  margin:0 -24px 22px;padding:13px 24px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:220px;background:var(--bg3);border:1px solid var(--line);
  color:var(--fg);padding:9px 14px;border-radius:9px;font-size:14px;font-family:inherit;
  outline:none;transition:.2s}
input[type=search]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(78,161,255,.12)}
input[type=search]::placeholder{color:var(--fg3)}
select{background:var(--bg3);border:1px solid var(--line);color:var(--fg);padding:9px 12px;
  border-radius:9px;font-size:13px;font-family:inherit;outline:none;cursor:pointer;max-width:230px}
.count{color:var(--fg3);font-size:12px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

.cats{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.chip{padding:5px 13px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);
  color:var(--fg2);font-size:12.5px;cursor:pointer;transition:.18s;user-select:none}
.chip:hover{border-color:var(--fg3);color:var(--fg)}
.chip.on{background:var(--c);border-color:var(--c);color:var(--chip-on-fg);font-weight:600}

section{margin:32px 0 0;scroll-margin-top:130px}
.sect-h{display:flex;align-items:center;gap:12px;padding:0 0 13px;
  border-bottom:2px solid var(--line);margin-bottom:16px}
.sect-h .ico{font-size:20px}
.sect-h h2{font-size:18.5px;font-weight:700;color:var(--c)}
.sect-h .desc{color:var(--fg3);font-size:12.5px;margin-top:1px}
.sect-h .num{margin-left:auto;font-size:12px;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap}

.subgrp{margin:20px 0 0}
.subgrp h3{font-size:13.5px;font-weight:600;color:var(--fg2);margin-bottom:9px;
  display:flex;align-items:center;gap:9px}
.subgrp h3::before{content:'';width:3px;height:13px;border-radius:2px;background:var(--c)}
.subgrp .n{color:var(--fg3);font-size:11.5px;font-weight:400}

.tbl{overflow-x:auto;overflow-y:hidden;border-radius:10px;max-width:100%}
.tbl::-webkit-scrollbar{height:8px}
.tbl::-webkit-scrollbar-thumb{background:rgba(120,140,165,.35);border-radius:4px}
table{width:100%;border-collapse:collapse;background:var(--bg2);border-radius:10px;
  overflow:hidden;border:1px solid var(--line)}
thead{background:var(--bg3)}
th{text-align:left;padding:9px 14px;font-size:12px;font-weight:600;color:var(--fg2);
  border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 14px;border-bottom:1px solid var(--rowline);vertical-align:top;font-size:13px}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--rowhover)}
td.zh{color:var(--fg);font-weight:500}
td.en{color:var(--fg2);font-family:Consolas,"Cascadia Mono",monospace;font-size:12.5px}
td.src{color:var(--fg3);font-size:11.5px;white-space:nowrap}
td.note{color:var(--fg3);font-size:11.5px}
mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:3px;padding:0 2px}

.empty{text-align:center;padding:70px 20px;color:var(--fg3)}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.5}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);
  color:var(--fg3);font-size:12px;text-align:center;line-height:1.9}

@media(max-width:720px){
  .wrap{padding:0 14px 60px}
  .toolbar{margin:0 -14px 18px;padding:12px 14px}
  h1{font-size:19px}
  td.src,th.src{display:none}
  .stat .n{font-size:19px}
  select{max-width:100%}
}
</style>
</head>

const META = {"icon": {"种族与势力": "🏳️", "世界观与场景": "🌍", "英雄与单位": "🦸", "技能与魔法效果": "✨", "物体数据字段": "📊", "触发器组件": "⚡", "AI 编辑器": "🤖", "编辑器界面": "🛠️", "地形与地图编辑": "🗺️", "通用与偏好": "⚙️"}, "desc": {"种族与势力": "种族、势力、单位分类（护甲 / 类型）等阵营相关术语", "世界观与场景": "战役章节、音乐主题、地表纹理、天气环境、物品分类等场景术语", "英雄与单位": "单位与英雄语音、单位命令、英雄技能、英雄属性、模型与动画", "技能与魔法效果": "技能数值字段、技能字段（实数 / 整数 / 布尔 / 字符串）、技能与魔法效果类型", "物体数据字段": "单位 / 物品 / 单位武器的各项数据字段，以及护甲、防御、移动等分类枚举", "触发器组件": "事件、条件、动作、函数、参数、触发类别等触发器术语", "AI 编辑器": "AI 编辑器函数与界面文本", "编辑器界面": "菜单、工具栏、面板、对象树、镜头、声音编辑器、载入画面等界面元素", "地形与地图编辑": "地形刷子、悬崖高度、地表纹理、路径、装饰物与可破坏物、区域", "通用与偏好": "首选项设置、通用按钮、警告错误、撤销保存、文件导出等"}, "color": {"种族与势力": "#e05c5c", "世界观与场景": "#4ea1ff", "英雄与单位": "#f0a04b", "技能与魔法效果": "#c77dff", "物体数据字段": "#5bc0be", "触发器组件": "#3ecf8e", "AI 编辑器": "#8b7cf6", "编辑器界面": "#f2c14e", "地形与地图编辑": "#5fa8d3", "通用与偏好": "#9aa5b1"}, "order": ["种族与势力", "世界观与场景", "英雄与单位", "技能与魔法效果", "物体数据字段", "触发器组件", "AI 编辑器", "编辑器界面", "地形与地图编辑", "通用与偏好"]};
const CATS = META.order;
const ICON = META.icon, DESC = META.desc;
// 夜间用：原亮色分类色
const COLOR_D = META.color;
// 日间用：同色系加深，保证白底可读（AA）
const COLOR_L = {"种族与势力":"#b8372f", "世界观与场景":"#1668b8", "英雄与单位":"#96601a",
  "技能与魔法效果":"#7b3fbf", "物体数据字段":"#17776f", "触发器组件":"#10804f",
  "AI 编辑器":"#4f3fc4", "编辑器界面":"#8a6400", "地形与地图编辑":"#1c6b93", "通用与偏好":"#5a6672"};
let COLOR = document.documentElement.getAttribute('data-theme') === 'light' ? COLOR_L : COLOR_D;

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl = (s, q) => {
  s = esc(s);
  if(!q) return s;
  const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
  return s.replace(re, '<mark>$1</mark>');
};

let state = {q:'', cat:'', sub:''};
let total = 0;

// 统计
function buildStats(){
  total = 0;
  $('#stats').innerHTML = CATS.map(c => {
    let n = 0;
    for(const sub in TREE[c]) n += TREE[c][sub].length;
    total += n;
    return `<div class="stat" data-cat="${c}" style="--c:${COLOR[c]}">
      <div class="n">${n.toLocaleString()}</div>
      <div class="t">${ICON[c]} ${c}</div>
      <div class="s">${Object.keys(TREE[c]).length} 个子类</div>
    </div>`;
  }).join('');
  $('#total').textContent = total.toLocaleString();
  $('#catn').textContent = CATS.length;
}

// 分类标签
function buildCats(){
  $('#cats').innerHTML =
    `<div class="chip${state.cat ? '' : ' on'}" data-cat="" style="--c:var(--accent)">全部 (${total.toLocaleString()})</div>` +
    CATS.map(c => {
      let n = 0; for(const sub in TREE[c]) n += TREE[c][sub].length;
      return `<div class="chip${state.cat === c ? ' on' : ''}" data-cat="${c}" style="--c:${COLOR[c]}">${ICON[c]} ${c} (${n.toLocaleString()})</div>`;
    }).join('');
}

function render(){
  const q = state.q.trim().toLowerCase();
  const cat = state.cat, subF = state.sub;
  let html = '', shown = 0;

  for(const c of CATS){
    if(cat && c !== cat) continue;
    let subs = Object.keys(TREE[c]);
    if(subF) subs = subs.filter(s => s === subF);
    if(!subs.length) continue;

    let catHtml = '';
    for(const sub of subs){
      const rows = [];
      for(const r of TREE[c][sub]){
        const hay = (r[0]+' '+r[1]+' '+r[2]+' '+r[3]).toLowerCase();
        if(q && !hay.includes(q)) continue;
        rows.push(r);
      }
      if(!rows.length) continue;
      shown += rows.length;
      catHtml += `<div class="subgrp">
        <h3 style="--c:${COLOR[c]}">${esc(sub)} <span class="n">${rows.length}</span></h3>
        <div class="tbl"><table>
          <thead><tr><th style="width:34%">中文译名</th><th style="width:38%">原文 / 标识</th><th class="src">来源</th><th style="width:16%">键名</th></tr></thead>
          <tbody>${rows.map(r=>`<tr>
            <td class="zh">${hl(r[1],q)}</td>
            <td class="en">${hl(r[0],q)}</td>
            <td class="src">${esc(r[3])}</td>
            <td class="note">${hl(r[2]||'',q)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    }
    if(!catHtml) continue;
    const n = subs.reduce((a,s)=>a+TREE[c][s].length,0);
    html += `<section id="sec-${c}" style="--c:${COLOR[c]}">
      <div class="sect-h">
        <span class="ico">${ICON[c]}</span>
        <div><h2>${c}</h2><div class="desc">${DESC[c]}</div></div>
        <span class="num">${n.toLocaleString()} 条</span>
      </div>
      ${catHtml}
    </section>`;
  }

  $('#body').innerHTML = html || `<div class="empty"><div class="big">🔍</div>没有匹配的词条<br><span style="font-size:12px">试试其他关键词，或切换分类</span></div>`;
  $('#cnt').textContent = (q || cat || subF) ? `匹配 ${shown.toLocaleString()} 条` : `共 ${total.toLocaleString()} 条`;
}

function refreshSubs(){
  const sel = $('#subSel');
  const cur = sel.value;
  const opts = ['<option value="">全部子类</option>'];
  const cats = state.cat ? [state.cat] : CATS;
  for(const c of cats){
    if(!TREE[c]) continue;
    for(const s of Object.keys(TREE[c])) opts.push(`<option value="${esc(s)}">${ICON[c]} ${esc(s)}</option>`);
  }
  sel.innerHTML = opts.join('');
  if(cur && [...sel.options].some(o=>o.value===cur)) sel.value = cur;
  else { sel.value=''; state.sub=''; }
}

$('#q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('#cats').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(!chip) return;
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
  chip.classList.add('on');
  state.cat = chip.dataset.cat; state.sub = '';
  refreshSubs(); render();
});
$('#stats').addEventListener('click', e => {
  const st = e.target.closest('.stat'); if(!st) return;
  const chip = document.querySelector(`.chip[data-cat="${st.dataset.cat}"]`);
  if(chip) chip.click();
});
$('#subSel').addEventListener('change', e => { state.sub = e.target.value; render(); });

buildStats();
buildCats();
refreshSubs();
render();

// ===== 日间 / 夜间模式 =====
const themeBtn = $('#themeBtn');
const isLight = () => document.documentElement.getAttribute('data-theme') === 'light';
function themeIcon(){ themeBtn.textContent = isLight() ? '🌙' : '☀️'; }
themeBtn.addEventListener('click', () => {
  const t = isLight() ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('site-theme', t); } catch(e) {}
  COLOR = t === 'light' ? COLOR_L : COLOR_D;
  themeIcon();
  buildStats();
  buildCats();
  render();
});
themeIcon();
</script>
</body>
</html>
