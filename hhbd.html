<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑器汉化补丁</title>
<meta name="description" content="魔兽争霸III 重制版地图编辑器的纯净汉化补丁：下载渠道、安装步骤与使用说明。">
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Ctext%20x=%221%22%20y=%2225%22%20font-size=%2223%22%20font-family=%22Segoe%20UI%20Emoji,Apple%20Color%20Emoji,Noto%20Color%20Emoji,sans-serif%22%3E%F0%9F%93%9C%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
<meta property="og:type" content="article">
<meta property="og:site_name" content="世界编辑器中文站">
<meta property="og:title" content="编辑器汉化补丁">
<meta property="og:description" content="重制版地图编辑器的纯净汉化补丁，含下载渠道与使用说明。">
<meta property="og:url" content="https://worldeditor.cn/hhbd.html">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2d333b;
    --text:#e6edf3; --muted:#9aa4b2; --accent:#e3b341;
    --code:#ffd479; --accent-bright:#f0d68a; --btn-shadow:rgba(0,0,0,.35);
  }
  body{
    margin:0;padding:64px 20px;
    background:var(--bg);color:var(--text);
    font:15px/1.9 -apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;
  }
  main{max-width:600px;margin:0 auto}
  .back{margin:0 0 24px}
  .back a{display:inline-block;font-size:13px;color:var(--muted);text-decoration:none;
    border:1px solid var(--border);background:var(--panel2);border-radius:20px;padding:3px 13px;
    transition:color .15s,border-color .15s}
  .back a:hover{color:var(--accent);border-color:var(--accent)}
  h1{margin:0 0 20px;font-size:22px;font-weight:600}
  h2{margin:36px 0 12px;font-size:15px;font-weight:600;padding-left:10px;border-left:3px solid var(--accent)}
  p{margin:0 0 12px}
  a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  a:hover{color:var(--accent-bright)}
  .sep{color:var(--muted);margin:0 10px}
  ol{margin:0;padding-left:22px}
  ol li{margin:0 0 8px}
  code{font-family:Consolas,Menlo,monospace;font-size:13.5px;color:var(--code)}
  .tip{color:var(--muted);font-size:13.5px}

  /* ===== 日间（浅色）令牌 ===== */
  :root[data-theme="light"]{
    --bg:#f6f4ef; --panel:#ffffff; --panel2:#f1eee7; --border:#ddd6c8;
    --text:#2b2720; --muted:#6b6559; --accent:#806428;
    --code:#785c12; --accent-bright:#6a5119; --btn-shadow:rgba(0,0,0,.12);
  }

  /* ===== 日/夜切换按钮 ===== */
  .theme-btn{position:fixed;top:14px;right:14px;z-index:99;width:30px;height:30px;border-radius:50%;
    border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:12px;line-height:1;
    cursor:pointer;box-shadow:0 2px 10px var(--btn-shadow,rgba(0,0,0,.3));}
  .theme-btn:hover{border-color:var(--accent);}
</style>
<script>
(function(){var t=null;try{t=localStorage.getItem('site-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t)})();
</script>
</head>
<body>
<button id="themeBtn" class="theme-btn" type="button" aria-label="切换日间/夜间模式" title="切换日间/夜间模式">☀️</button>
<main>

  <div class="back"><a href="index.html">← 返回主页</a></div>

  <h1>编辑器汉化补丁</h1>

  <p>适用于《魔兽争霸III：重制版》地图编辑器的纯净汉化补丁。</p>

  <h2>下载渠道</h2>
  <p>
    <a href="https://k12cs.cn/downloads/%E7%BC%96%E8%BE%91%E5%99%A8%E6%B1%89%E5%8C%96%E8%A1%A5%E4%B8%810.5.0.zip">直接下载</a> <span class="sep">|</span> <a href="https://github.com/kobayashi1998/worldeditor-zhcn/releases">Github 下载</a>
  </p>

  <h2>使用说明</h2>
  <ol>
    <li>双击 <code>AllowLocalFiles.reg</code>，在弹出的提示窗口中点击确定。</li>
    <li>将补丁中的 <code>_retail_</code> 文件夹复制到游戏根目录即可。</li>
  </ol>
  <p class="tip">补丁使游戏优先调用本地文件，不涉及修改游戏本体；删除相关文件即可移除本补丁。</p>

</main>

<script>
(function(){var d=document,b=d.getElementById('themeBtn');
function icon(){b.textContent=d.documentElement.getAttribute('data-theme')==='light'?'🌙':'☀️'}
b.addEventListener('click',function(){var t=d.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
d.documentElement.setAttribute('data-theme',t);try{localStorage.setItem('site-theme',t)}catch(e){}icon()});
icon()})();
</script>
</body></html>
